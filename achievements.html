<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<!-- Particle Background -->
<script src="particles.js"></script>
<script>
  // Disable right-click + show warning
  document.addEventListener("contextmenu", function (e) {
    e.preventDefault();
    showAccessDenied();
  });

  // Block common inspect shortcuts (basic deterrent)
  document.addEventListener("keydown", function (e) {
    const key = e.key.toLowerCase();

    if (
      key === "f12" ||
      (e.ctrlKey && e.shiftKey && (key === "i" || key === "j")) ||
      (e.ctrlKey && key === "u")
    ) {
      e.preventDefault();
      showAccessDenied();
    }
  });

  function showAccessDenied() {
    // Prevent multiple popups
    if (document.getElementById("access-denied-popup")) return;

    const popup = document.createElement("div");
    popup.id = "access-denied-popup";
    popup.textContent = "⚠ ACCESS DENIED";

    Object.assign(popup.style, {
      position: "fixed",
      top: "50%",
      left: "50%",
      transform: "translate(-50%, -50%)",
      padding: "20px 40px",
      background: "black",
      color: "#39ff14",
      border: "2px solid #39ff14",
      boxShadow: "0 0 30px #39ff14",
      zIndex: "100000",
      fontSize: "1.5rem",
      borderRadius: "20px",
      fontFamily: "monospace"
    });

    document.body.appendChild(popup);

    setTimeout(() => popup.remove(), 1500);
  }
</script>
<!-- ================= NEON/GLITCH LIGHT/DARK TOGGLE ================= -->
<button id="themeToggle" class="neon-btn">🌙</button>

<style>
.neon-btn{
  position:fixed;
  top:20px;
  right:20px;
  background:#000;
  color:#39ff14;
  padding:12px 18px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
  font-size:1.2rem;
  z-index:9999;
  text-shadow:
     0 0 5px #39ff14,
     0 0 10px #39ff14,
     0 0 20px #0ff,
     0 0 30px #0ff;
  box-shadow:
     0 0 5px #39ff14,
     0 0 10px #39ff14,
     0 0 20px #0ff,
     0 0 30px #0ff;
  animation: flicker 2s infinite;
  transition: all 0.2s ease-in-out;
}

/* Hover effect to float and intensify glow */
.neon-btn:hover{
  transform: translateY(-5px) scale(1.1);
  text-shadow:
     0 0 10px #39ff14,
     0 0 20px #39ff14,
     0 0 30px #0ff,
     0 0 40px #0ff;
  box-shadow:
     0 0 10px #39ff14,
     0 0 20px #39ff14,
     0 0 30px #0ff,
     0 0 40px #0ff;
}

/* Flicker animation */
@keyframes flicker{
  0%, 19%, 21%, 23%, 25%, 54%, 56%, 100%{
    opacity:1;
    text-shadow:
       0 0 5px #39ff14,
       0 0 10px #39ff14,
       0 0 20px #0ff,
       0 0 30px #0ff;
  }
  20%, 24%, 55%{
    opacity:0.8;
    text-shadow:none;
  }
}
</style>

<script>
themeToggle.onclick = () => document.body.classList.toggle("light");
</script>
